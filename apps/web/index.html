<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Apply the saved theme before first paint so there is no flash
      // of the wrong theme. Keep the names in sync with src/theme.ts.
      try {
        var savedTheme = localStorage.getItem("syncboard-theme");
        if (savedTheme !== "dark" && savedTheme !== "light" && savedTheme !== "dose") {
          // Older builds used longer names ending in "-dark"/"-light".
          if (savedTheme && savedTheme.slice(-5) === "-dark") {
            savedTheme = "dark";
          } else if (savedTheme && savedTheme.slice(-6) === "-light") {
            savedTheme = "light";
          } else {
            savedTheme = "dark";
          }
        }
        document.documentElement.dataset.theme = savedTheme;
      } catch (error) {
        document.documentElement.dataset.theme = "dark";
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="SyncBoard is a real-time collaborative whiteboard for sticky notes, shapes, and text, shared live."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700&family=Instrument+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232e7d5b'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='700' fill='%23ffffff' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E"
    />
    <title>SyncBoard: real-time collaborative whiteboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
