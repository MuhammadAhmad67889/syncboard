<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2200" viewBox="0 0 1280 2200" font-family="Inter, Arial, sans-serif">
  <style>
    .title { font-size: 20px; font-weight: bold; fill: #0f172a; }
    .note-text { font-size: 18px; fill: #0f172a; }
    .hint { font-size: 14px; fill: #64748b; }
    .small { font-size: 13px; }
    .label { font-size: 14px; fill: #0f172a; }
  </style>

  <!-- Frame 1: Board canvas -->
  <text class="title" x="24" y="40">01 · Board canvas — everyone sees the same board</text>
  <rect x="24" y="56" width="1232" height="680" rx="16" fill="#f6f7f9" stroke="#e6e8ec"/>
  <rect x="80" y="120" width="220" height="200" rx="8" fill="#fef08a"/>
  <text class="note-text" x="96" y="150">Ship Phase 1</text>
  <text class="note-text" x="96" y="176">by Friday</text>
  <rect x="380" y="220" width="220" height="200" rx="8" fill="#fbcfe8"/>
  <text class="note-text" x="396" y="250">Ask Sara to</text>
  <text class="note-text" x="396" y="276">review the API</text>
  <rect x="700" y="120" width="220" height="200" rx="8" fill="#bbf7d0"/>
  <text class="note-text" x="716" y="150">Demo on</text>
  <text class="note-text" x="716" y="176">Monday 10am</text>
  <rect x="374" y="214" width="232" height="212" rx="10" fill="none" stroke="#2563eb" stroke-width="2"/>
  <text class="small" x="380" y="448" fill="#2563eb">Sara selected this</text>
  <circle cx="627" cy="187" r="7" fill="#2563eb"/>
  <text x="647" y="191" font-size="13" font-weight="bold" fill="#2563eb">Ahmad</text>
  <circle cx="427" cy="437" r="7" fill="#db2777"/>
  <text x="447" y="441" font-size="13" font-weight="bold" fill="#db2777">Sara</text>
  <rect x="1080" y="660" width="140" height="40" rx="20" fill="#ffffff" stroke="#e6e8ec"/>
  <text class="label" x="1100" y="685">−   100%   +</text>
  <text class="hint" x="48" y="712">Drag to pan · Scroll to zoom · Double-click to add a note</text>

  <!-- Frame 2: Toolbar -->
  <text class="title" x="24" y="900">02 · Toolbar — tools, colors, undo</text>
  <rect x="24" y="944" width="900" height="64" rx="12" fill="#ffffff" stroke="#e6e8ec"/>
  <rect x="44" y="960" width="80" height="32" rx="8" fill="#f6f7f9" stroke="#e6e8ec"/>
  <text class="label" x="58" y="981">Select</text>
  <rect x="140" y="960" width="80" height="32" rx="8" fill="#eff6ff" stroke="#2563eb"/>
  <text class="label" x="158" y="981" fill="#2563eb">Note</text>
  <rect x="236" y="960" width="80" height="32" rx="8" fill="#f6f7f9" stroke="#e6e8ec"/>
  <text class="label" x="254" y="981">Text</text>
  <rect x="332" y="960" width="80" height="32" rx="8" fill="#f6f7f9" stroke="#e6e8ec"/>
  <text class="label" x="346" y="981">Undo</text>
  <rect x="428" y="960" width="80" height="32" rx="8" fill="#f6f7f9" stroke="#e6e8ec"/>
  <text class="label" x="442" y="981">Redo</text>
  <text x="540" y="982" font-size="20" fill="#64748b">|</text>
  <circle cx="582" cy="976" r="12" fill="#fef08a" stroke="#2563eb" stroke-width="2"/>
  <circle cx="618" cy="976" r="12" fill="#fbcfe8" stroke="#e6e8ec"/>
  <circle cx="654" cy="976" r="12" fill="#bbf7d0" stroke="#e6e8ec"/>
  <circle cx="690" cy="976" r="12" fill="#bfdbfe" stroke="#e6e8ec"/>
  <circle cx="726" cy="976" r="12" fill="#ddd6fe" stroke="#e6e8ec"/>
  <circle cx="762" cy="976" r="12" fill="#fed7aa" stroke="#e6e8ec"/>
  <text class="label" x="800" y="981">−  100%  +</text>
  <text class="hint" x="24" y="1040">The active tool is highlighted. Color dots set the next note's color. Undo only reverts your own edits.</text>

  <!-- Frame 3: Presence bar -->
  <text class="title" x="24" y="1140">03 · Presence bar — who is here right now</text>
  <rect x="24" y="1184" width="900" height="64" rx="12" fill="#ffffff" stroke="#e6e8ec"/>
  <circle cx="60" cy="1216" r="16" fill="#2563eb"/>
  <text x="56" y="1221" font-size="14" font-weight="bold" fill="#ffffff">A</text>
  <circle cx="76" cy="1226" r="5" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <text class="label" x="88" y="1221">Ahmad (you)</text>
  <circle cx="260" cy="1216" r="16" fill="#db2777"/>
  <text x="256" y="1221" font-size="14" font-weight="bold" fill="#ffffff">S</text>
  <circle cx="276" cy="1226" r="5" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <text class="label" x="288" y="1221">Sara</text>
  <circle cx="460" cy="1216" r="16" fill="#059669"/>
  <text x="456" y="1221" font-size="14" font-weight="bold" fill="#ffffff">O</text>
  <circle cx="476" cy="1226" r="5" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
  <text class="label" x="488" y="1221">Omar</text>
  <text x="800" y="1221" font-size="14" font-weight="bold" fill="#0f172a">3 online</text>
  <text class="hint" x="24" y="1280">Avatars show everyone on the board. The green dot means online. Your own cursor is blue.</text>
  <text class="hint" x="24" y="1316">Sara is editing “Ask Sara to review the API” · Omar is viewing the board</text>

  <!-- Frame 4: Note editor -->
  <text class="title" x="24" y="1400">04 · Note editor — text, color, size, delete</text>
  <rect x="24" y="1444" width="320" height="320" rx="8" fill="#fef08a"/>
  <text class="note-text" x="48" y="1478">Ship Phase 1</text>
  <text class="note-text" x="48" y="1504">by Friday</text>
  <text class="note-text" x="48" y="1550">- server runs</text>
  <text class="note-text" x="48" y="1576">- two tabs sync</text>
  <rect x="320" y="1740" width="16" height="16" rx="4" fill="#ffffff" stroke="#e6e8ec"/>
  <text x="400" y="1462" font-size="14" font-weight="bold" fill="#0f172a">Color</text>
  <circle cx="414" cy="1490" r="14" fill="#fef08a" stroke="#2563eb" stroke-width="2"/>
  <circle cx="454" cy="1490" r="14" fill="#fbcfe8" stroke="#e6e8ec"/>
  <circle cx="494" cy="1490" r="14" fill="#bbf7d0" stroke="#e6e8ec"/>
  <circle cx="534" cy="1490" r="14" fill="#bfdbfe" stroke="#e6e8ec"/>
  <circle cx="574" cy="1490" r="14" fill="#ddd6fe" stroke="#e6e8ec"/>
  <circle cx="614" cy="1490" r="14" fill="#fed7aa" stroke="#e6e8ec"/>
  <text x="400" y="1540" font-size="15" fill="#64748b">Click the note to edit its text.</text>
  <text x="400" y="1564" font-size="15" fill="#64748b">Two people typing in the same note</text>
  <text x="400" y="1588" font-size="15" fill="#64748b">both see each other's words.</text>
  <rect x="400" y="1630" width="110" height="36" rx="8" fill="#ffffff" stroke="#dc2626"/>
  <text x="420" y="1654" font-size="14" fill="#dc2626">Delete note</text>
  <text class="hint" x="400" y="1700">Ctrl+Z undoes only your own edits.</text>
</svg>
